name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.meta.outputs.build_version }}
      image_name: ${{ steps.meta.outputs.image_name }}
      release_version: ${{ steps.meta.outputs.release_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - name: Validate tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./package.json').version")"
          expected_tag="v${release_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${release_version}" >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA::12}"
          # GHCR requires the owner segment to be lowercase.
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${owner_lc}/${repo_lc}"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "build_version=${release_version}+sha.${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run check:local-app

  build-image:
    runs-on: ubuntu-latest
    needs:
      - meta
      - checks
    outputs:
      image_digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4
        with:
          # amd64-only builds can use the runner's embedded BuildKit and avoid
          # pulling moby/buildkit from Docker Hub while booting a container builder.
          driver: docker

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and push linux/amd64 image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: local/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_RELEASE_VERSION=${{ needs.meta.outputs.release_version }}
            APP_BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.meta.outputs.build_version }}
            APP_VERSION_TOKEN=${{ needs.meta.outputs.build_version }}
          provenance: false
          tags: |
            ${{ needs.meta.outputs.image_name }}:${{ github.ref_name }}
            ${{ needs.meta.outputs.image_name }}:${{ needs.meta.outputs.release_version }}
            ${{ needs.meta.outputs.image_name }}:sha-${{ needs.meta.outputs.short_sha }}
            ${{ needs.meta.outputs.image_name }}:latest

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - meta
      - build-image
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - name: Prepare selfhost release assets
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.build-image.outputs.image_digest }}
          IMAGE_NAME: ${{ needs.meta.outputs.image_name }}
        run: |
          set -euo pipefail
          node scripts/selfhost-release-assets.cjs \
            --output dist/release-assets \
            --tag "${GITHUB_REF_NAME}" \
            --build-sha "${GITHUB_SHA}" \
            --image "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --image-tag "${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "SubBoost ${GITHUB_REF_NAME}" \
            --notes-file docs/release-notes.md \
            --draft \
            dist/release-assets/release.json \
            dist/release-assets/install.sh \
            dist/release-assets/docker-compose.image.yml \
            dist/release-assets/subboost-manager
