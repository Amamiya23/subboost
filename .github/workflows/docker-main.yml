name: Build Docker Image (main)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.meta.outputs.build_version }}
      image_name: ${{ steps.meta.outputs.image_name }}
      release_version: ${{ steps.meta.outputs.release_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::12}"
          # GHCR requires the owner segment to be lowercase.
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${owner_lc}/${repo_lc}"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "build_version=${release_version}+sha.${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

  build-image:
    runs-on: ubuntu-latest
    needs: meta
    outputs:
      image_digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4
        with:
          # amd64-only builds can use the runner's embedded BuildKit and avoid
          # pulling moby/buildkit from Docker Hub while booting a container builder.
          driver: docker

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Build and push linux/amd64 image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: local/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_RELEASE_VERSION=${{ needs.meta.outputs.release_version }}
            APP_BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.meta.outputs.build_version }}
            APP_VERSION_TOKEN=${{ needs.meta.outputs.build_version }}
          provenance: false
          tags: |
            ${{ needs.meta.outputs.image_name }}:main
            ${{ needs.meta.outputs.image_name }}:sha-${{ needs.meta.outputs.short_sha }}

      - name: Summary
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.meta.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Docker image published"
            echo ""
            echo "| Tag | Reference |"
            echo "| --- | --------- |"
            echo "| \`main\` | \`${IMAGE_NAME}:main\` |"
            echo "| \`sha-${SHORT_SHA}\` | \`${IMAGE_NAME}:sha-${SHORT_SHA}\` |"
            echo ""
            echo "amd64 image digest: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
